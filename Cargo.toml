[package]
name = "richrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native Rust terminal formatting utility inspired by Textualize Rich CLI"
license = "MIT"
default-run = "rich"

[[bin]]
name = "rich"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
crossterm = "0.29"
pulldown-cmark = "0.13"
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1.3"
syntect = "5.3"
terminal_size = "0.4"
unicode-width = "0.2"
unicode-segmentation = "1.12"
ureq = "3.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
