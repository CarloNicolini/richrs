name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Check release version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -c 'import os,tomllib; assert os.environ["TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["package"]["version"]'
      - run: cargo test --locked
      - if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          CC: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        env:
          CC: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive executable
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist stage/completions stage/docs
          cargo run --quiet --locked -- --generate-completions bash > stage/completions/rich.bash
          cargo run --quiet --locked -- --generate-completions zsh > stage/completions/rich.zsh
          cargo run --quiet --locked -- --generate-completions fish > stage/completions/rich.fish
          cp "target/$TARGET/release/rich" LICENSE NOTICE stage/
          cp docs/UPSTREAM-LICENSE docs/RICH-LICENSE docs/PYGMENTS-LICENSE stage/docs/
          tar -czf "dist/richrs-$TAG-$TARGET.tar.gz" -C stage rich LICENSE NOTICE docs completions
      - uses: actions/upload-artifact@v4
        with:
          name: richrs-${{ matrix.target }}
          path: dist/*.tar.gz
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and Homebrew formula
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/package-release.py --repository "$REPOSITORY" --version "$TAG"
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* install.sh --draft --generate-notes --title "richrs $TAG"
